apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-management-system
  labels:
    app: hospital-management-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hospital-management-system
  template:
    metadata:
      labels:
        app: hospital-management-system
    spec:
      containers:
      - name: hospital-management-system
        image: ayaigadern/hospital-management-system:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
